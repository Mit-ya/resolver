name: tmp-download-statbooks
on:
  push:
    branches: [main]
    paths: ['.github/workflows/tmp-download-statbooks.yml']
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - name: Download and assemble books
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p parts books

          for i in 1 2 3 4 5 6 7 8; do
            curl -fL --retry 3 --retry-delay 1 --connect-timeout 20 --max-time 300 \
              "https://cdn.ruarxive.org/public/saved_istmat/books/26588_${i}.pdf" \
              -o "parts/26588_${i}.pdf"
          done

          python3 -m pip install -q pypdf
          python3 - <<'PY'
          from pypdf import PdfWriter, PdfReader
          from pathlib import Path
          w=PdfWriter()
          for i in range(1,9):
              p=Path('parts')/f'26588_{i}.pdf'
              print(i, len(PdfReader(str(p)).pages), p.stat().st_size)
              w.append(str(p))
          w.write('books/1989_Narodnoe_obrazovanie_i_kultura_SSSR_FULL.pdf')
          w.close()
          PY

          curl -fL --retry 3 --retry-delay 1 --connect-timeout 20 --max-time 300 \
            'https://cdn.ruarxive.org/public/saved_istmat/books/33489_1.pdf' \
            -o 'books/1990_Nauchno-tehnicheskiy_progress_v_SSSR_FULL.pdf'

          pdfinfo books/1989_Narodnoe_obrazovanie_i_kultura_SSSR_FULL.pdf | grep -E 'Pages|File size' || true
          pdfinfo books/1990_Nauchno-tehnicheskiy_progress_v_SSSR_FULL.pdf | grep -E 'Pages|File size' || true

      - uses: actions/upload-artifact@v4
        with:
          name: ussr-statbooks-full-cdn
          path: books/*.pdf
          if-no-files-found: error
          retention-days: 1
