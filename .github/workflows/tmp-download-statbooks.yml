name: tmp-download-statbooks
on:
  push:
    branches: [main]
    paths: ['.github/workflows/tmp-download-statbooks.yml']
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - name: Download and assemble books
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p parts books

          base='https://istmat.org/files/uploads/26588'
          files=(
            obraz_sssr_1989_vvedenie.pdf
            obraz_sssr_1989_svodnyy.pdf
            obraz_sssr_1989_chislennost.pdf
            obraz_sssr_1989_obrazovanie.pdf
            obraz_sssr_1989_kultura.pdf
            obraz_sssr_1989_stroitelstvo.pdf
            obraz_sssr_1989_metodologiya.pdf
            obraz_sssr_1989_soderzhanie.pdf
          )
          for f in "${files[@]}"; do
            curl -fL --retry 4 --retry-delay 2 --connect-timeout 30 --max-time 900 \
              "$base/$f" -o "parts/$f"
          done

          python3 -m pip install -q pypdf
          python3 - <<'PY'
          from pypdf import PdfWriter
          from pathlib import Path
          order=[
            'obraz_sssr_1989_vvedenie.pdf',
            'obraz_sssr_1989_svodnyy.pdf',
            'obraz_sssr_1989_chislennost.pdf',
            'obraz_sssr_1989_obrazovanie.pdf',
            'obraz_sssr_1989_kultura.pdf',
            'obraz_sssr_1989_stroitelstvo.pdf',
            'obraz_sssr_1989_metodologiya.pdf',
            'obraz_sssr_1989_soderzhanie.pdf',
          ]
          w=PdfWriter()
          for name in order:
              w.append(str(Path('parts')/name))
          w.write('books/1989_Narodnoe_obrazovanie_i_kultura_SSSR_FULL.pdf')
          w.close()
          PY

          curl -fL --retry 4 --retry-delay 2 --connect-timeout 30 --max-time 900 \
            'https://cdn.ruarxive.org/public/saved_istmat/books/33489_1.pdf' \
            -o 'books/1990_Nauchno-tehnicheskiy_progress_v_SSSR_FULL.pdf'

          ls -lh parts books
          pdfinfo books/1989_Narodnoe_obrazovanie_i_kultura_SSSR_FULL.pdf | grep -E 'Pages|File size' || true
          pdfinfo books/1990_Nauchno-tehnicheskiy_progress_v_SSSR_FULL.pdf | grep -E 'Pages|File size' || true

      - uses: actions/upload-artifact@v4
        with:
          name: ussr-statbooks-full
          path: books/*.pdf
          if-no-files-found: error
          retention-days: 1
