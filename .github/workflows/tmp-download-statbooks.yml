name: tmp-download-statbooks
on:
  push:
    branches: [main]
    paths: ['.github/workflows/tmp-download-statbooks.yml']
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - name: Download books
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p books
          curl -fL --retry 3 --connect-timeout 30 --max-time 600 \
            'https://cdn.ruarxive.org/public/saved_istmat/books/26588_1.pdf' \
            -o 'books/1989_Narodnoe_obrazovanie_i_kultura_SSSR.pdf'
          curl -fL --retry 3 --connect-timeout 30 --max-time 600 \
            'https://cdn.ruarxive.org/public/saved_istmat/books/33489_1.pdf' \
            -o 'books/1990_Nauchno-tehnicheskiy_progress_v_SSSR.pdf'
          ls -lh books
          file books/*

      - uses: actions/upload-artifact@v4
        with:
          name: ussr-statbooks
          path: books/*.pdf
          if-no-files-found: error
          retention-days: 1

      - name: Publish to temporary branch
        shell: bash
        run: |
          set -euxo pipefail
          git init out
          cd out
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -b statbooks-output
          cp -a ../books .
          git add books
          git commit -m 'temporary USSR statistical books'
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin statbooks-output
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
